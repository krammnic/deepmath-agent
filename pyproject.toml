[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deepmath-agent"
version = "0.2.0"
description = "Multiagent mathematical research with reproducible experiments and proof obligations"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
search = ["h5py", "kagglehub", "networkx", "numba", "numpy>=1.26", "scipy", "torch>=2.6"]
qk = ["numpy>=1.26", "torch>=2.6", "transformers>=4.56.2,<5", "accelerate>=0.26"]
research = ["h5py", "kagglehub", "networkx", "numba", "numpy>=1.26", "scipy", "torch>=2.6", "transformers>=4.56.2,<5", "accelerate>=0.26", "cmake>=3.28", "ninja>=1.11"]

[project.scripts]
deepmath = "deepmath.cli:main"
qk-zero-shot = "qk_zero_shot.cli:main"

[tool.setuptools.data-files]
"share/deepmath" = ["dependencies.lock.json"]
"share/deepmath/references" = ["references/sources.json"]
"share/deepmath/docs" = ["docs/research.md", "docs/lrx-case-study.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
