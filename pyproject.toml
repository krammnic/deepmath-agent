[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deepmath-agent"
version = "0.1.0"
description = "Multiagent mathematical research with reproducible experiments and proof obligations"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
search = ["cayleypy>=0.2.0"]
qk = ["numpy>=1.26", "torch>=2.2", "transformers>=4.45", "accelerate>=0.26"]

[project.scripts]
deepmath = "deepmath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/deepmath" = ["dependencies.lock.json"]
"share/deepmath/references" = ["references/sources.json"]
"share/deepmath/docs" = ["docs/research.md", "docs/lrx-case-study.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
