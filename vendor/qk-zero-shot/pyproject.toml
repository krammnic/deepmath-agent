[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qk-zero-shot"
version = "0.1.0"
description = "Calibration-free reasoning verification from transformer query-key scores"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Mark", email = "75219117+krammnic@users.noreply.github.com"}]
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "transformers>=4.45",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
qk-zero-shot = "qk_zero_shot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
